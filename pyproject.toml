[project]
name = "invisible-planet"
version = "0.1.0"
description = "Inferring an unseen planet from transit timing variations in a Kepler-90-inspired system"
readme = "README.md"
requires-python = ">=3.10,<3.13"

# Taichi supports Python 3.10-3.12 only, which is why the upper bound exists.
dependencies = [
    "taichi>=1.7,<2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
data = ["pandas>=2.0"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "pandas>=2.0", "matplotlib>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invisible_planet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Physics validation is slow by nature; show the slowest tests so regressions in
# run time are visible.
addopts = "-q --durations=10"
markers = [
    "slow: long-running scientific validation (deselect with '-m \"not slow\"')",
]
